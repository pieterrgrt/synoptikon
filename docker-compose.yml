services:
  app:
    build: .
    container_name: synoptikon
    restart: unless-stopped
    env_file: .env
    # Alleen bereikbaar via loopback; nginx op de host doet TLS en de hostnaam.
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/gezond').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
