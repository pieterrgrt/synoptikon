<!doctype html>
<html lang="{{ huidige_taal() }}" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ _('Inloggen') }} · Synoptikon</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ sv }}">
{% include "_iconen.html" %}
<script src="/static/js/thema.js?v={{ sv }}"></script>
</head>
<body class="login-body">
<main class="login">
  <h1><span class="merk-teken" aria-hidden="true">Σ</span> Synoptikon</h1>
  <p class="stil">{{ _('Rechtsvergelijking, naast elkaar.') }}</p>
  {% if fout %}<p class="melding fout" role="alert">{{ fout }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="volgende" value="{{ volgende }}">
    <label>{{ _('Gebruikersnaam') }} <input name="gebruikersnaam" value="{{ gebruikersnaam }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required {% if not gebruikersnaam %}autofocus{% endif %}></label>
    <label>{{ _('Wachtwoord') }} <input type="password" name="wachtwoord" autocomplete="current-password" required {% if gebruikersnaam %}autofocus{% endif %}></label>
    <button type="submit" class="knop primair">{{ _('Inloggen') }}</button>
  </form>
  {% if aanmelden %}<p class="stil klein"><a href="/aanmelden">{{ _('Nieuw? Maak een account met je uitnodigingscode.') }}</a></p>{% endif %}
  <form method="post" action="/taal" class="taalkeuze login-taal">
    <input type="hidden" name="terug" value="/login?volgende={{ volgende | urlencode }}">
    <label>{{ _('Taal') }}
      <select name="taal" class="auto-submit">{% for k, v in TALEN.items() %}<option value="{{ k }}" lang="{{ k }}" {% if k == huidige_taal() %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
    </label>
    <noscript><button class="knop klein">OK</button></noscript>
  </form>
</main>
<script src="/static/js/app.js?v={{ sv }}"></script>
</body>
</html>
